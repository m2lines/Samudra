name: Property mutation gate

on:
  pull_request:
    paths:
      - .github/workflows/property-mutations.yaml
      - .github/workflows/property-soak.yaml
      - data/ocean_preprocessing/virtualize_om4.py
      - data/tests/property/**
      - data/tests/mutation/**
      - data/pyproject.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/property-mutations.yaml
      - data/ocean_preprocessing/virtualize_om4.py
      - data/tests/property/**
      - data/tests/mutation/**
      - data/pyproject.toml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-regressions:
    if: >-
      github.event_name != 'pull_request' || (
        !startsWith(github.head_ref, 'experiment/') &&
        !contains(github.event.pull_request.labels.*.name, 'experiment')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e './data[test]'
      - name: Verify generated discovery of historical faults
        run: |
          set -o pipefail
          python data/tests/mutation/virtual_archive_mutants.py \
            --output /tmp/property-mutations --seeds 0 1 95920261105 --timeout 60 \
            2>&1 | tee /tmp/property-mutations-run.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-mutations
          path: |
            /tmp/property-mutations/
            /tmp/property-mutations-run.log
          retention-days: 30
