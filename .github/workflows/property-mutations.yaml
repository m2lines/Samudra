name: Property mutation gate

on:
  pull_request:
    paths:
      - .github/workflows/property-mutations.yaml
      - .github/workflows/property-soak.yaml
      - data/ocean_preprocessing/virtualize_om4.py
      - data/tests/*_properties.py
      - data/tests/*_mutations.py
      - src/samudra/test_utils/**
      - data/tests/conftest.py
      - data/pyproject.toml
      - data/.test*.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/property-mutations.yaml
      - data/ocean_preprocessing/virtualize_om4.py
      - data/tests/*_properties.py
      - data/tests/*_mutations.py
      - src/samudra/test_utils/**
      - data/tests/conftest.py
      - data/pyproject.toml
      - data/.test*.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: property-mutations-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-regressions:
    if: >-
      github.event_name != 'pull_request' || (
        !startsWith(github.head_ref, 'experiment/') &&
        !contains(github.event.pull_request.labels.*.name, 'experiment')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d
        with:
          environment-file: data/.test.yml
          environment-name: verification
          cache-downloads: true
      - name: Install local verifier and data sources
        shell: bash -el {0}
        run: python -m pip install --no-deps --no-build-isolation -e ./src/samudra/test_utils -e ./data
      - name: Verify generated discovery of historical faults
        shell: bash -el {0}
        run: |
          set -o pipefail
          python -m samudra.test_utils.mutations data/tests \
            --output /tmp/property-mutations --seeds 0 1 95920261105 --timeout 60 --budget 600 \
            2>&1 | tee /tmp/property-mutations-run.log
      - name: Preserve solved environment and summarize
        if: always()
        shell: bash -el {0}
        run: |
          if test -d /tmp/property-mutations; then
            micromamba list --explicit > /tmp/property-mutations/conda-explicit.txt
            cat /tmp/property-mutations/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-mutations
          path: |
            /tmp/property-mutations/
            /tmp/property-mutations-run.log
          retention-days: 30
