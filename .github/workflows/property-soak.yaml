name: Property soak

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  samudra:
    name: Samudra CPU properties (locked)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install main project independently of data
        timeout-minutes: 10
        run: uv sync --locked --dev
      - name: Explore CPU properties with common replay artifacts
        run: |
          uv run --locked python -m samudra_verification.campaign \
            --project samudra --lane pinned --tests tests/test_*_properties.py verification/tests --dependency-file uv.lock \
            --output /tmp/property-soak --examples 1000 --timeout 1800 \
            -- -m "not manual and not cuda"
      - name: Summarize campaign
        if: always()
        run: test ! -f /tmp/property-soak/summary.md || cat /tmp/property-soak/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-soak-samudra-pinned
          path: /tmp/property-soak/
          retention-days: 30

  mutation-gate:
    uses: ./.github/workflows/property-mutations.yaml

  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # pip resolves the newest versions data/pyproject.toml allows, so these are
        # canary lanes, one for each pandas string storage backend.
        storage: [python, pyarrow]
    env:
      SAMUDRA_HYPOTHESIS_PROFILE: soak
      SAMUDRA_HYPOTHESIS_EXAMPLES: "1000"
      SAMUDRA_STRING_STORAGE: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the data-test environment
        # The packages data-tests.yaml installs: the newest versions data/pyproject.toml allows.
        run: |
          uv venv /tmp/data-env
          uv pip install --python /tmp/data-env -e ./verification -e "./data[test]"
          echo /tmp/data-env/bin >> "$GITHUB_PATH"
      - name: Explore and shrink
        id: data-campaign
        working-directory: data
        run: |
          shopt -s nullglob
          property_tests=()
          for test_file in tests/test_*_properties.py; do
            # Virtual archive properties need the separate Zarr 3 environment.
            [[ "$test_file" == tests/test_virtual_archive_properties.py ]] && continue
            property_tests+=("$test_file")
          done
          if (( ${#property_tests[@]} == 0 )); then
            echo "No data property modules for the Zarr 2 environment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has-tests=true" >> "$GITHUB_OUTPUT"
          python -m samudra_verification.campaign --project data --lane canary --tests "${property_tests[@]}" \
            --dependency-file pyproject.toml --output /tmp/property-soak \
            --examples 1000 --timeout 1800
      - name: Preserve solved environment and summarize
        if: always()
        run: |
          if test -d /tmp/property-soak; then
            uv pip freeze --python /tmp/data-env > /tmp/property-soak/requirements-frozen.txt
            cat /tmp/property-soak/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.data-campaign.outputs.has-tests == 'true'
        with:
          name: property-soak-data-canary-${{ matrix.storage }}
          path: /tmp/property-soak/
          retention-days: 30

  report:
    needs: [explore, samudra]
    if: >-
      always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: property-soak-*
          path: /tmp/property-soaks
      - name: Summarize failures and recurrences without filing issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          campaigns=()
          for artifact in /tmp/property-soaks/property-soak-*; do
            if test -f "$artifact/pytest.jsonl"; then
              campaigns+=("$artifact")
            else
              echo "**${artifact##*/}:** no \`pytest.jsonl\`; the campaign did not start pytest." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          status=0
          if test "${#campaigns[@]}" -gt 0; then
            # Triage summarizes every readable campaign, then fails if any was unreadable.
            uv run --locked --no-dev --package samudra-verification python -m samudra_verification.triage "${campaigns[@]}" \
              --repo "$GH_REPO" --run-url "$RUN_URL" --triage-output /tmp/property-triage || status=$?
            for summary in /tmp/property-triage/*/summary.md; do
              if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-triage
          path: /tmp/property-triage/
          retention-days: 30
