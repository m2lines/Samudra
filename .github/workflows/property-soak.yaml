name: Property soak

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  samudra:
    name: Samudra CPU properties (locked)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install main project independently of data
        timeout-minutes: 10
        run: uv sync --locked --dev
      - name: Explore CPU properties with common replay artifacts
        run: |
          uv run --locked python -m samudra_verification.campaign \
            --project samudra --lane pinned --tests tests/test_*_properties.py verification/tests --dependency-file uv.lock \
            --output /tmp/property-soak --examples 1000 --timeout 1800 \
            -- -m "not manual and not cuda"
      - name: Summarize campaign
        if: always()
        run: test ! -f /tmp/property-soak/summary.md || cat /tmp/property-soak/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-soak-samudra-pinned
          path: /tmp/property-soak/
          retention-days: 30

  mutation-gate:
    uses: ./.github/workflows/property-mutations.yaml

  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: pinned
            storage: python
            environment: data/.test.yml
          - lane: pinned
            storage: pyarrow
            environment: data/.test.yml
          - lane: canary
            storage: pyarrow
            environment: data/.test-canary.yml
    env:
      SAMUDRA_HYPOTHESIS_PROFILE: soak
      SAMUDRA_HYPOTHESIS_EXAMPLES: "1000"
      SAMUDRA_STRING_STORAGE: ${{ matrix.storage }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d
        with:
          environment-file: ${{ matrix.environment }}
          environment-name: verification
          cache-downloads: true
      - name: Install local projects without resolving third-party packages
        shell: bash -el {0}
        run: python -m pip install --no-deps --no-build-isolation -e ./verification -e ./data
      - name: Explore and shrink
        working-directory: data
        shell: bash -el {0}
        env:
          DEPENDENCY_FILE: ../${{ matrix.environment }}
        run: |
          python -m samudra_verification.campaign --project data --lane "$LANE" --tests tests/test_*_properties.py \
            --dependency-file "$DEPENDENCY_FILE" --output /tmp/property-soak \
            --examples 1000 --timeout 1800
      - name: Preserve solved environment and summarize
        if: always()
        shell: bash -el {0}
        run: |
          if test -d /tmp/property-soak; then
            micromamba list --explicit > /tmp/property-soak/conda-explicit.txt
            cat /tmp/property-soak/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-soak-data-${{ matrix.lane }}-${{ matrix.storage }}
          path: /tmp/property-soak/
          retention-days: 30

  report:
    needs: [explore, samudra]
    if: >-
      always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: property-soak-*
          path: /tmp/property-soaks
      - name: Summarize failures and recurrences without filing issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for artifact in /tmp/property-soaks/property-soak-*; do
            lane=$(basename "$artifact")
            if test -f "$artifact/pytest.jsonl"; then
              uv run --locked --no-dev --package samudra-verification python -m samudra_verification.triage "$artifact" \
                --repo "$GH_REPO" --run-url "$RUN_URL" --triage-output "/tmp/property-triage/$lane"
              cat "/tmp/property-triage/$lane/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-triage
          path: /tmp/property-triage/
          retention-days: 30
