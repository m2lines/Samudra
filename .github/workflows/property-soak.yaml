name: Property soak

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-gate:
    uses: ./.github/workflows/property-mutations.yaml

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated producer and actual Zarr 2 reader
        run: |
          python -m pip install -r data/tests/verification-py312.txt
          python -m pip install --no-deps --no-build-isolation -e ./data
          python -m venv /tmp/zarr2-client
          /tmp/zarr2-client/bin/python -m pip install -r data/tests/zarr2-client-py312.txt
      - name: Check real client and bounded public byte transport
        env:
          SAMUDRA_ZARR2_PYTHON: /tmp/zarr2-client/bin/python
          SAMUDRA_OSN_CHECK: "1"
          SAMUDRA_HYPOTHESIS_PROFILE: soak
          SAMUDRA_HYPOTHESIS_EXAMPLES: "10"
        run: |
          mkdir -p /tmp/property-integrations
          git rev-parse HEAD > /tmp/property-integrations/revision.txt
          python --version > /tmp/property-integrations/python.txt
          python -m pip freeze > /tmp/property-integrations/producer.txt
          /tmp/zarr2-client/bin/python -m pip freeze > /tmp/property-integrations/client.txt
          set -o pipefail
          python -m pytest data/tests/property -k 'zarr2_client or osn_ranges' \
            --hypothesis-seed=95920261105 --hypothesis-show-statistics \
            --junitxml=/tmp/property-integrations/junit.xml 2>&1 | tee /tmp/property-integrations/pytest.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-integrations
          path: /tmp/property-integrations/
          retention-days: 30

  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: pinned
            storage: python
          - lane: pinned
            storage: pyarrow
          - lane: canary
            storage: pyarrow
    env:
      SAMUDRA_HYPOTHESIS_PROFILE: soak
      SAMUDRA_HYPOTHESIS_EXAMPLES: "1000"
      SAMUDRA_STRING_STORAGE: ${{ matrix.storage }}
      VERIFICATION_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install regression or canary stack
        timeout-minutes: 5
        run: |
          if test "$VERIFICATION_LANE" = pinned; then
            python -m pip install -r data/tests/verification-py312.txt
          else
            python -m pip install -r data/tests/verification.in
          fi
          python -m pip install --no-deps --no-build-isolation -e ./data
      - name: Record replay inputs
        run: |
          mkdir -p /tmp/property-soak
          python -m pip freeze > /tmp/property-soak/environment.txt
          git rev-parse HEAD > /tmp/property-soak/revision.txt
          python -c 'import secrets; print(secrets.randbits(64))' > /tmp/property-soak/seed.txt
          python --version > /tmp/property-soak/python.txt
          uname -a > /tmp/property-soak/platform.txt
          python -c 'import json, os; print(json.dumps({k: os.environ[k] for k in ("SAMUDRA_HYPOTHESIS_PROFILE", "SAMUDRA_HYPOTHESIS_EXAMPLES", "SAMUDRA_STRING_STORAGE", "VERIFICATION_LANE")}))' > /tmp/property-soak/profile.json
      - name: Explore and shrink
        id: explore
        working-directory: data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python -m pytest tests/property -v --tb=short --disable-warnings \
            --hypothesis-seed="$(cat /tmp/property-soak/seed.txt)" \
            --hypothesis-show-statistics --junitxml=/tmp/property-soak/junit.xml \
            2>&1 | tee /tmp/property-soak/pytest.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-soak-${{ matrix.lane }}-${{ matrix.storage }}
          path: /tmp/property-soak/
          retention-days: 30

  report:
    needs: explore
    if: >-
      always() && needs.explore.result != 'skipped' && needs.explore.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: property-soak-*
          path: /tmp/property-soaks
      - name: Summarize failures and recurrences without filing issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for artifact in /tmp/property-soaks/property-soak-*; do
            lane=$(basename "$artifact")
            if test -f "$artifact/junit.xml"; then
              python scripts/file_property_failures.py "$artifact/junit.xml" \
                --repo "$GH_REPO" --run-url "$RUN_URL" --lane "$lane" --triage-output "/tmp/property-triage/$lane"
              cat "/tmp/property-triage/$lane/summary.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-triage
          path: /tmp/property-triage/
          retention-days: 30
