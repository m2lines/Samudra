# Run CPU-only tests for the project via pytest
name: Test CPU

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:
  workflow_call:  # let the Release workflow gate publishes on this suite

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-cpu:
    if: >-
      github.event_name != 'pull_request' || (
        !startsWith(github.head_ref, 'experiment/') &&
        !contains(github.event.pull_request.labels.*.name, 'experiment')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

        # Invalidate the data cache every time the data source changes.
        # If an exact cache isn't found, fall back to previous cache.
      - name: Cache test data
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: .data_cache/
          key: ${{ runner.os }}-test-data-${{ hashFiles('tests/conftest.py', 'tests/configs/*.yaml') }}

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        run: uv sync --locked --dev

      - name: Run pytest
        run: uv run --locked pytest -n 2 -v -m "not manual and not cuda" --ignore=tests/property --durations=20 --durations-min=1.0

      - name: Bounded CPU property checks with replay artifacts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv run --locked python scripts/run_property_suite.py \
            --suite samudra --tests tests/property --dependency-file uv.lock \
            --output /tmp/property-pr --examples 40 --timeout 600 \
            -- -m "not manual and not cuda"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: property-pr-samudra
          path: /tmp/property-pr/
          retention-days: 30
