repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix", "--config", "pyproject.toml"]
        exclude: ^notebooks/
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
        exclude: ^notebooks/
