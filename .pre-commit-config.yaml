repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix", "--config", "pyproject.toml"]
        exclude: ^notebooks/
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
        exclude: ^notebooks/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=250]
        # Fixed scientific records; each is under 3 MB, without weights.
        exclude: ^(notebooks/|experiments/precision_competition/results/(bits-lost\.csv|curves\.csv|records\.json\.gz)$|experiments/precision_competition/followup_results/(curves\.csv\.gz|records\.json\.gz)$|experiments/precision_competition/noise_results/(perturb-bits[46]-seed(11|22|33)\.json\.gz|trajectories\.csv\.gz|trajectory-summary\.csv\.gz)$|experiments/precision_competition/encoding_results/((curves|raw)-(ar_nested|ar_overlap|ar_twohot_hard|ar_twohot_soft|ar_uniform|parallel_nested)\.(csv|json)\.gz|auxiliary-learning\.png|auxiliary-probes\.png|copy-learning\.png)$|experiments/precision_competition/encoding_extension_results/((curves|raw)-(ar_overlap_scaled|ar_twohot_hard_scaled|ar_twohot_soft_scaled|cont_fixed_mse|cont_shrink_mse|cont_shrink_normalized)\.(csv|json)\.gz|auxiliary-learning\.png|auxiliary-probes\.png|continuous-stage-comparison\.png|copy-learning\.png|stage-weighting-comparison\.png)$)
      - id: trailing-whitespace
        exclude: ^notebooks/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^notebooks/
  # We define our own mypy checker here rather than using https://github.com/pre-commit/mirrors-mypy
  # so it can run within our uv environment & access the correct installed libraries. See:
  # https://whynothugo.nl/journal/2023/01/12/notes-on-pre-commit/#using-the-system-plugin-language
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        require_serial: true
        entry: uv run --dev mypy
        types_or: [python, pyi]
        args: ["--config", "pyproject.toml"]
        exclude: ^(notebooks/|data/|tests/reference/)
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.5.0"
    hooks:
      - id: pyproject-fmt
  - repo: local
    hooks:
      - id: validate-schemas
        name: validate-schemas
        language: system
        require_serial: true
        entry: uv run src/samudra/config_schema.py
        pass_filenames: false
        args: []
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
