repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix", "--config", "pyproject.toml"]
        exclude: ^notebooks/
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
        exclude: ^notebooks/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=250]
        exclude: ^(notebooks/|experiments/temperature_skyline/all-fields-classification/.*\.(png|gz)$|experiments/temperature_skyline/all-fields-scaling/report/|experiments/temperature_skyline/continuation-results/validation-((regression|classifier-rmse|classifier-nll)-depths|(regression|likelihood)-full)\.png$|experiments/temperature_skyline/maps-(initial|continuation)/report/comparison-(global|regional)\.png$|experiments/temperature_skyline/maps-initial/report/map-(global|north-pacific|gulf-stream|agulhas)-depth-(00|07|13)\.png$|experiments/temperature_skyline/pre-spike-noise/report/.*\.(png|npz)$)
      - id: check-added-large-files
        name: check skyline scaling report sizes
        args: [--maxkb=1024]
        files: ^experiments/temperature_skyline/all-fields-scaling/report/
      - id: check-added-large-files
        name: check skyline classification report sizes
        args: [--maxkb=512]
        files: ^experiments/temperature_skyline/all-fields-classification/.*\.(png|gz)$
      # Lossless maps retain two pixels per sample along each axis without interpolation.
      - id: check-added-large-files
        name: check skyline raster sizes
        args: [--maxkb=1024]
        files: ^experiments/temperature_skyline/maps-initial/report/map-(global|north-pacific|gulf-stream|agulhas)-depth-(00|07|13)\.png$
      - id: check-added-large-files
        name: check skyline comparison figure sizes
        args: [--maxkb=4096]
        files: ^experiments/temperature_skyline/maps-(initial|continuation)/report/comparison-(global|regional)\.png$
      - id: check-added-large-files
        name: check skyline validation figure sizes
        args: [--maxkb=512]
        files: ^experiments/temperature_skyline/continuation-results/validation-((regression|classifier-rmse|classifier-nll)-depths|(regression|likelihood)-full)\.png$
      - id: check-added-large-files
        name: check skyline noise diagnostic artifacts
        args: [--maxkb=4096]
        files: ^experiments/temperature_skyline/pre-spike-noise/report/.*\.(png|npz)$
      - id: trailing-whitespace
        exclude: ^notebooks/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^notebooks/
  # We define our own mypy checker here rather than using https://github.com/pre-commit/mirrors-mypy
  # so it can run within our uv environment & access the correct installed libraries. See:
  # https://whynothugo.nl/journal/2023/01/12/notes-on-pre-commit/#using-the-system-plugin-language
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        require_serial: true
        entry: uv run --dev mypy
        types_or: [python, pyi]
        args: ["--config", "pyproject.toml"]
        exclude: ^(notebooks/|data/|tests/reference/)
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.5.0"
    hooks:
      - id: pyproject-fmt
  - repo: local
    hooks:
      - id: validate-schemas
        name: validate-schemas
        language: system
        require_serial: true
        entry: uv run src/samudra/config_schema.py
        pass_filenames: false
        args: []
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
