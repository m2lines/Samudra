repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix", "--config", "pyproject.toml"]
        exclude: ^notebooks/
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
        exclude: ^notebooks/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=250]
        # Exact-grid figures and the two complete 96-origin numerical dumps.
        exclude: ^(docs/experiments/diffusion-interior-beta/global-final-assets/test/(spectra|calibration)\.json\.gz$|docs/experiments/diffusion-interior-beta/global-final-assets/(annual/annual-(2015|2018|2021)-01-01-day(30|365)-(thetao_0|zos)|native/fields-(12|312|588)-day30-(thetao_9|so_9|uo_9)|test/members-(2015|2018|2021)-01-(thetao_0|zos|thetao_9|so_9))\.png$|docs/experiments/diffusion-interior-beta/global-early-assets/(obs(50|100|250|2000|2000-steps64|4000|6000)/)?(sampling-)?members-(2013-11|2014-03|2014-07)-(thetao_0|zos|thetao_9|so_9)\.png$|docs/experiments/diffusion-interior-beta/grain-assets/((pretrained|adapted)-(om4-2018|obs-2018-01-01)-day(30|365)-(thetao_0|zos|thetao_9|so_9)|denoise-(pretrained|adapted)-(thetao_0|zos|thetao_9|so_9)|denoiser-noise-gain|sampler-spectra-day(30|365))\.png$|docs/experiments/diffusion-interior-beta/correlated-noise-assets/((paired|white|correlated)-(2015|2018|2021)-(thetao_0|zos|thetao_9|so_9)|member-spectra)\.png$|docs/experiments/diffusion-interior-beta/endpoint-assets/(obs-adapted|om4-pretrained|om4-adapted)-(1729|1730)-(2015|2018|2021)-day(30|365)-(thetao_0|zos|thetao_9|so_9)\.png$|docs/experiments/diffusion-interior-beta/latent-extension-assets/((initial-(so_9|thetao_9|uo_9)|initializer-(so_0|so_9|thetao_9)|monthly-so9)-(1729|1730)-(2015|2018|2021)-01|annual-map-[0-3]-(2015|2018|2021)|day30-broad-spectra-(1729|1730|2015)|interior-calibration|temporal-variability)\.png$|docs/experiments/diffusion-interior-beta/latent-assets/(initial-(so_9|thetao_9|uo_9)|monthly-so9)-(1729|1730)-(2015|2018|2021)-01\.png$|docs/experiments/observation-d/artifacts/2026-09-25-checkpoint-maps/(rollout/day30-2022-(01|07)-(anomalies|fields)-(sst|adt)|initializer-july-channel-(5|24|47|66))\.(png|pdf)$|notebooks/|docs/experiments/observation-d/artifacts/(2026-09-23|2026-09-24-budget/matched)/maps/day30-2022-(01|07)-(anomalies|fields)-(sst|adt)\.(png|pdf)$|docs/experiments/observation-d/artifacts/2026-09-24-budget/matched/evidence\.json\.gz$)
      - id: trailing-whitespace
        exclude: ^notebooks/
      - id: check-yaml
        args: [--unsafe]
        exclude: ^notebooks/
  # We define our own mypy checker here rather than using https://github.com/pre-commit/mirrors-mypy
  # so it can run within our uv environment & access the correct installed libraries. See:
  # https://whynothugo.nl/journal/2023/01/12/notes-on-pre-commit/#using-the-system-plugin-language
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        require_serial: true
        entry: uv run --dev mypy
        types_or: [python, pyi]
        args: ["--config", "pyproject.toml"]
        exclude: ^(notebooks/|data/|tests/reference/)
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.5.0"
    hooks:
      - id: pyproject-fmt
  - repo: local
    hooks:
      - id: validate-schemas
        name: validate-schemas
        language: system
        require_serial: true
        entry: uv run src/samudra/config_schema.py
        pass_filenames: false
        args: []
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
