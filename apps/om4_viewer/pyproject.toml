[project]
name = "samudra-om4-viewer"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Match the reader validated against the prepared Zarr 2 stores.
dependencies = [
  "aiohttp>=3.11",
  "cftime>=1.6",
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "scipy>=1.15",
  "xarray==2025.1.2",
  "zarr>=2.18,<3",
]
