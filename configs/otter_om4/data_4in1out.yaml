# yaml-language-server: $schema=../schemas/DataConfig.json

sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    # The native reader currently supports physical fields, not derived anomalies.
    boundary_vars_key: tau_hfds
    train_time:
      start: "1975-01-03"
      end: "2013-10-05"
    val_time:
      start: "2013-10-05"
      end: "2014-10-05"
    inference_times:
      - start: "2014-10-10"
        end: "2022-12-24"
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
concurrent_compute: true
loading:
  type: rust
  prefetch_batches: 2
  max_concurrent_reads: 8
  prefetch_to_device: true
hist: 3
output_steps: 1
time_embedding_num_scales: 16
time_embedding_min_hours: 3.0
time_embedding_max_hours: 8760.0
