# yaml-language-server: $schema=../schemas/TrainConfig.json

debug: false
disk_mode: true
pin_mem: true
save_freq: 100
validation_image_log_freq: 10
epochs: 20
batch_size: 1
gradient_accumulation_steps: 2
gradient_clip_norm: 10.0
test_using_ema: false
ema_decay: null
learning_rate: 0.0002
optimizer:
  type: muon
  momentum: 0.95
  weight_decay: 0.15
scheduler:
  type: warmup_cosine_updates
  # 20 * ceil(ceil(2827 / 8 ranks) / 2 accumulation) for the 1-degree split.
  total_updates: 3540
  warmup_updates: 500
  min_lr: 0.000002
loss:
  type: otter_weighted_rmse
finetune: false
resume_ckpt_path: null
inference_epochs: []
data_stride: [1]
steps: [1]
step_transition: []
step_transition_fraction: []
preemptible: false
backend: auto

experiment:
  name: otter_om4_1deg_paper_pretrain
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include data_4in1out.yaml
model: !include model_paper.yaml
