# Floats every dependency within the range data/pyproject.toml supports, to catch upstream
# breakage early. data/pyproject.toml pins virtualizarr and kerchunk exactly, so they are
# pinned here too. To test newer versions of either, widen its pin there first.
name: samudra-data-canary
channels:
  - conda-forge
dependencies:
  - python=3.12
  - virtualizarr=2.8.0
  - kerchunk=0.2.10
  - xarray>=2025.6,<2026.4
  - zarr>=3.1.6,<4
  - numpy
  - pandas
  - fsspec
  - s3fs>=2025.10
  - pyarrow
  - obstore>=0.12
  - obspec_utils>=0.9
  - fire>=0.7.1
  - scipy
  - h5netcdf>=1.7.3
  - h5py
  - cftime
  - pytest>=8.3.4
  - hypothesis>=6.170.13
  - pytest-reportlog>=1.0
  - setuptools>=61
  - wheel
  - pip
