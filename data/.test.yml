# Focused archive verification environment. Mamba owns all third-party packages;
# install the two local projects with pip --no-deps --no-build-isolation afterward.
# These are direct version pins, not a transitive lock. Each CI artifact captures
# the solved environment with `micromamba list --explicit` for exact replay.
name: samudra-data-test
channels:
  - conda-forge
dependencies:
  - python=3.12
  - virtualizarr=2.8.0
  - kerchunk=0.2.10
  - xarray=2026.2.0
  - zarr=3.4.2
  - numpy=2.5.4
  - pandas=3.1.1
  - fsspec=2026.9.0
  - s3fs=2026.9.0
  - pyarrow=26.0.0
  - obstore>=0.12
  - obspec_utils>=0.9
  - fire>=0.7.1
  - scipy
  - h5netcdf>=1.7.3
  - h5py
  - cftime
  - pytest=9.2.0
  - hypothesis=6.170.13
  - pytest-reportlog=1.0.0
  - setuptools>=61
  - wheel
  - pip
