name: ocean_preprocessing
channels:
  - conda-forge
dependencies:
    - python=3.11
    - xarray
    - cftime
    - xarrayutils
    - xgcm>=0.8.1,<0.10
    - gcm_filters  # to avoid https://stackoverflow.com/questions/7446187/no-module-named-pkg-resources which seemed to have https://github.com/m2lines/ocean_emulators/actions/runs/10392595642/job/28778202015?pr=53
    - setuptools
    - fire==0.7.1
    - cartopy
    - zarr==2.18.2
    - numcodecs<0.16  # Zarr 2 imports Blosc helpers removed in Numcodecs 0.16.
    - gcsfs
    - s3fs
    - xesmf
    - bokeh
    - h5netcdf
    - h5py  # h5netcdf backend for the HDF5-based OISST/ARGO-IAP NetCDF files
    - copernicusmarine  # DUACS downloads; needs a free Copernicus Marine account
    - matplotlib
    - coiled
    - distributed
    - pip:
      - -e .  # local sources
