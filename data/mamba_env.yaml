name: ocean_preprocessing
channels:
  - conda-forge
dependencies:
    - python=3.12
    - xarray>=2025.6,<2026.4  # Retain compressor encoding for Zarr v2 writes.
    - cftime
    - xarrayutils
    - xgcm>=0.8.1,<0.10
    - gcm_filters  # to avoid https://stackoverflow.com/questions/7446187/no-module-named-pkg-resources which seemed to have https://github.com/m2lines/ocean_emulators/actions/runs/10392595642/job/28778202015?pr=53
    - setuptools
    - fire==0.7.1
    - cartopy
    - zarr>=3.1.6,<4  # Runtime supports VirtualiZarr; writers explicitly emit Zarr v2.
    - numcodecs>=0.15.1
    - obstore>=0.12
    - obspec_utils>=0.9
    - virtualizarr==2.8.0
    - kerchunk==0.2.10
    - pyarrow
    - hdf5plugin
    - imagecodecs
    - gcsfs
    - s3fs
    - xesmf
    - bokeh
    - h5netcdf
    - h5py  # h5netcdf backend for the HDF5-based OISST/ARGO-IAP NetCDF files
    - copernicusmarine  # DUACS downloads; needs a free Copernicus Marine account
    - matplotlib
    - coiled
    - distributed
    - pip
    - pip:
      - -e .  # local sources
      - -e ../src/samudra/test_utils  # shared test helpers that data/tests/conftest.py imports
