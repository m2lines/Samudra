name: ocean_preprocessing
channels:
  - conda-forge
dependencies:
    - python=3.12
    - xarray>=2025.6,<2026.4  # Retain compressor encoding for Zarr v2 writes.
    - cftime
    - xarrayutils
    - xgcm>=0.8.1,<0.10
    - gcm_filters  # to avoid https://stackoverflow.com/questions/7446187/no-module-named-pkg-resources which seemed to have https://github.com/m2lines/ocean_emulators/actions/runs/10392595642/job/28778202015?pr=53
    - setuptools
    - fire==0.7.1
    - cartopy
    - zarr>=2.18,<3  # As samudra. virtualize_om4.py, which needs 3, has its own environment.
    - numcodecs>=0.15.1,<0.16
    - numpy>=2,<3
    - pyarrow  # Reads the Kerchunk Parquet references to the raw archive.
    - hdf5plugin
    - imagecodecs
    - gcsfs
    - s3fs
    - xesmf
    - bokeh
    - h5netcdf
    - h5py  # h5netcdf backend for the HDF5-based OISST/ARGO-IAP NetCDF files
    - copernicusmarine  # DUACS downloads; needs a free Copernicus Marine account
    - matplotlib
    - coiled
    - distributed
    - pip
    - pip:
      - -e ..  # shared Samudra routines from this checkout
      - -e .[observations]  # local sources
      - -e ../verification  # samudra_verification, which data/tests/conftest.py imports
