# pyproject.toml

[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61", "wheel" ]

[project]
name = "ocean-preprocessing"
version = "0.1.0"
description = "Data engineering routines to prepare ocean simulations for neural emulation."
readme = "README.md"
keywords = [ "climate", "data", "emulators", "ml", "preprocessing" ]
license = { text = "Apache-2.0" }
authors = [
  { name = "Adam Subel", email = "adam.subel@nyu.edu" },
  { name = "Julius Busecke", email = "julius@ldeo.columbia.edu" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "bokeh>=3.1",
  "cartopy>=0.23",
  "cftime>=1.6.4.post1", # CM4 no-leap and OM4 Julian calendars
  "copernicusmarine>=2", # DUACS downloads; needs a free Copernicus Marine account
  "dask[distributed]",   # Cluster-backed processing and normalization writes
  "fire>=0.7.1",
  "gcm-filters",         # to avoid https://stackoverflow.com/questions/7446187/no-module-named-pkg-resources which seemed to have https://github.com/m2lines/ocean_emulators/actions/runs/10392595642/job/28778202015?pr=53
  "gcsfs>=2025.10",
  "h5netcdf>=1.7.3",
  "h5py",                # h5netcdf's backend for the HDF5-based OISST/ARGO NetCDF files
  "numcodecs<0.16",      # Zarr 2 imports Blosc helpers removed in Numcodecs 0.16.
  "pypdl>=1.5",          # concurrent, segmented downloads of the observation archives
  "s3fs>=2025.10",
  "setuptools",
  "xarray<2026.4",       # Keep using version of xarray compatible with zarr library version 2
  "xarrayutils",         # Vector-rotation QC plotting
  "xarrera",
  "xesmf>=0.8.10",
  "xgcm>=0.9,<0.10",     # Explicit boundary padding and autoparse_metadata API.
  "zarr>=2.18.2,<3",
]

optional-dependencies.dev = [
  "ocean-preprocessing[test]",
  "pre-commit",
]
optional-dependencies.test = [
  "dask",
  "h5py",
  "pytest",
]

[tool.setuptools.packages.find]
exclude = [ "book", "docs" ] # exclude packages matching these glob patterns (empty by default)

[tool.pytest.ini_options]
testpaths = [ "tests" ]
