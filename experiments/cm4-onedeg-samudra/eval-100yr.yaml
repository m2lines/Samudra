      prognostic_vars_key: thermo_dynamic_all
      boundary_vars_key: tau_hfds_wfo
      train_time: {start: "0151-01-06", end: "0231-01-01"}
      val_time: {start: "0231-01-06", end: "0251-01-01"}
      inference_time: {start: "0251-01-06", end: "0351-01-01"}
      data_location: CM4.zarr
      data_means_location: CM4_means.zarr
      data_stds_location: CM4_stds.zarr

model: !include ../../src/samudra/configs/samudra_om4/model.yaml
