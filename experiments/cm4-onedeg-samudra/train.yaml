# Current samudra_om4 preset, with CM4 dates/fields and native Rust I/O.
debug: false
disk_mode: true
save_freq: 5
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
validation_score: rollout_rmse
epochs: 70
batch_size: 4
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler: {type: cosine}
loss: {type: dynamic, metric: mse, limit: 20}
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps: [4]
step_transition: []
preemptible: false
backend: auto
post_train_eval: null

experiment:
  name: cm4-onedeg-samudra-20261017
  rand_seed: 15
  base_output_dir: /projects/ny/lz1955/multiscale/jrusak/runs/cm4-onedeg-samudra-20261017/output
  data_root: /projects/ny/lz1955/multiscale/jrusak/data/cm4_onedeg
  wandb:
    mode: online
    entity: ocean_emulators
    project: default

data:
  input_steps: 2
  output_steps: 2
  loading:
    type: rust
    max_concurrent_reads: 8
    prefetch_batches: 2
    prefetch_to_device: true
  sources:
    - type: cm4
      prognostic_vars_key: thermo_dynamic_all
      boundary_vars_key: tau_hfds_wfo
      # Interval-end timestamps: 80 / 20 / 100 no-leap years.
      train_time: {start: "0151-01-06", end: "0231-01-01"}
      val_time: {start: "0231-01-06", end: "0251-01-01"}
      inference_time: {start: "0251-01-06", end: "0351-01-01"}
      data_location: CM4.zarr
      data_means_location: CM4_means.zarr
      data_stds_location: CM4_stds.zarr

model: !include ../../src/samudra/configs/samudra_om4/model.yaml
