debug: false
save_zarr: true
disk_mode: true
num_model_steps_forward: 25
backend: cuda
experiment:
  name: current-ke-seasonal
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    entity: ocean_emulators
    project: default
  data_root: /projects/ny/lz1955/multiscale/jrusak/data/om4/v2026-09/om4_onedeg # pragma: allowlist secret - verified dataset path
data:
  sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    train_time:
      start: '1975-01-03'
      end: '2013-10-05'
    val_time:
      start: '2013-10-05'
      end: '2014-10-05'
    inference_times:
    - start: '2014-10-10'
      end: '2022-12-24'
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
  loading:
    type: rust
    max_concurrent_reads: 8
    prefetch_batches: 2
    prefetch_to_device: true
model:
  checkpointing: all
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  use_bfloat16: true
  unet:
    ch_width:
    - 280
    - 380
    - 480
    - 520
    dilation:
    - 1
    - 2
    - 4
    - 8
    n_layers:
    - 1
    - 1
    - 1
    - 1
    core_block:
      block_type: conv_next_block
      kernel_size: 3
      activation: capped_gelu
      upscale_factor: 2
      norm: instance
    down_sampling_block: avg_pool
    up_sampling_block: zonally_periodic_upsample
    stochastic_depth_rate: 0.0
  auxiliary_ke: true
