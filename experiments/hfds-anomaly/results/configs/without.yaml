backend: cuda
batch_size: 4
data:
  input_steps: 2
  loading: {concurrent_compute: true, num_workers: 0, persistent_workers: false, pin_mem: true,
    type: cpu}
  output_steps: 2
  sources:
  - boundary_vars_key: tau_hfds
    data_location: OM4.zarr
    data_means_location: /orcd/pool/008/jrusak/om4-current-structure-20261020/normalization/OM4_means.zarr
    data_stds_location: /orcd/pool/008/jrusak/om4-current-structure-20261020/normalization/OM4_stds.zarr
    inference_time: {end: '2022-12-24', start: '2014-10-10'}
    prognostic_vars_key: thermo_dynamic_all
    train_time: {end: '2013-09-30', start: '1975-01-03'}
    type: om4
    val_time: {end: '2014-10-05', start: '2013-10-05'}
data_stride: [1]
debug: false
disk_mode: true
epochs: 70
experiment:
  base_output_dir: /orcd/pool/008/jrusak/om4-hfds-ablation-20261021/outputs
  data_root: /orcd/data/abodner/002/jrusak/om4_onedeg_v3
  name: hfds-without
  rand_seed: 15
  wandb: {entity: ocean_emulators, group: hfds-anomaly-1deg-20261021, mode: online,
    project: default}
finetune: false
gradient_accumulation_steps: 8
learning_rate: 0.0006
loss: {limit: 20, metric: mse, type: dynamic}
model:
  checkpointing: all
  last_kernel_size: 3
  pad: circular
  pred_residuals: false
  unet:
    ch_width: [280, 380, 480, 520]
    core_block: {activation: capped_gelu, block_type: conv_next_block, kernel_size: 3,
      norm: instance, upscale_factor: 2}
    dilation: [1, 2, 4, 8]
    down_sampling_block: avg_pool
    n_layers: [1, 1, 1, 1]
    up_sampling_block: zonally_periodic_upsample
  use_bfloat16: true
post_train_eval: null
preemptible: true
resume_ckpt_path: null
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
save_freq: 70
scheduler: {type: cosine}
step_transition: []
steps: [4]
validation_score: rollout_rmse
