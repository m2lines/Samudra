# 1° OM4 v2026-09, Samudra 2's layout: two input states, two five-day outputs
# per model call. Identical for both arms.
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds_hfds_anom
    train_time:
      start: "1975-01-03"
      end: "2013-09-30"
    val_time:
      start: "2013-10-05"
      end: "2014-10-05"
    inference_time:
      start: "2014-10-10"
      end: "2022-12-24"
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
# The Rust loader keeps 8 GPUs fed; the Python CPU loader does not at 1°. It
# needs hfds_anomalies materialized, so data_root is the staged
# v2026-09/om4_onedeg_rust store.
loading:
  type: rust
  max_concurrent_reads: 8
inference_loading:
  num_workers: 4
  persistent_workers: true
input_steps: 2
output_steps: 2
