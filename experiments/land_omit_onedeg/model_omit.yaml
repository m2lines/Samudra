# Samudra 2 (the bundled samudra_om4_v2 preset), with land: omit.
# The two arms' model files differ only in that line.
checkpointing: all
pred_residuals: false
last_kernel_size: 3
pad: "circular"
use_bfloat16: false
land: omit

unet:
  ch_width: [280, 380, 480, 520]
  dilation: [1, 2, 4, 8]
  n_layers: [1, 1, 1, 1]

  core_block:
    block_type: "conv_next_block"
    kernel_size: 3
    activation: "capped_gelu"
    upscale_factor: 2
    norm: "batch"

  down_sampling_block: "avg_pool"
  up_sampling_block: "zonally_periodic_upsample"
