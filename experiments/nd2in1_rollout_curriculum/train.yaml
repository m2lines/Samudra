# GraphCast-style autoregressive fine-tuning of PR #984's final checkpoint.
# Model, loss and data are identical to experiments/normalized_delta_2in1out.
# Only the training horizon and optimizer schedule change:
#   rollouts of 12 -> 24 -> 36 five-day steps (60 -> 180 days), switching at
#   epochs 5 and 10, one sample per GPU (8 ranks, global batch 8), and a fresh
#   Adam at a low learning rate. Pass the base checkpoint with
#   --resume_ckpt_path=<#984 run>/saved_nets/ckpt.pt.
debug: false
disk_mode: true
save_freq: 5
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
validation_score: rollout_rmse
epochs: 15
# 36 steps x 1 sample uses about the GPU memory of #984's 8 steps x 4 samples
# (#969 peaked at 71.8 GB with 8 x 4).
batch_size: 1
learning_rate: 0.00003
gradient_accumulation_steps: 1
scheduler: { type: cosine }
ema_decay: 0.999
faster_decay_at_start: false
test_using_ema: true
loss:
  type: normalized_delta
  increment_rms_location: OM4_increment_rms_wet.zarr
# Load model and EMA weights only; start a new optimizer and schedule.
finetune: true
resume_ckpt_path: null
data_stride: [1]
steps: [12, 24, 36]
step_transition: [5, 10]
# Fine-tuning can't resume after preemption in this trainer.
preemptible: false

backend: auto

experiment:
  name: nd2in1_rollout_curriculum
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../normalized_delta_2in1out/data.yaml
model: !include ../normalized_delta_2in1out/model.yaml
