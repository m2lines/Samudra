# Δ-norm 2→1 trained from scratch with a GraphCast-style rollout curriculum
# instead of a fixed 8-call (40-day) horizon. Model, loss, data, optimizer,
# epochs and seed are identical to experiments/normalized_delta_2in1out; only
# the rollout length changes over training. The effective batch stays at 32
# (8 ranks x batch x accumulation) in every stage.
#
#   epochs  1-29   1 call  (5 days)    batch 4 x accumulation 1
#   epochs 30-44   2 calls (10 days)   batch 4 x 1
#   epochs 45-54   4 calls (20 days)   batch 4 x 1
#   epochs 55-61   8 calls (40 days)   batch 4 x 1   (Δ-norm 2→1's horizon)
#   epochs 62-66  16 calls (80 days)   batch 2 x 2
#   epochs 67-70  32 calls (160 days)  batch 1 x 4
#
# Memory scales with calls x batch: 16 x 2 and 32 x 1 match 8 x 4, and the
# curriculum fine-tune ran 36 x 1 on the same GPUs.
debug: false
disk_mode: true
save_freq: 5
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
validation_score: rollout_rmse
epochs: 70
batch_size: 4
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler: { type: cosine }
ema_decay: 0.999
faster_decay_at_start: true
test_using_ema: true
loss:
  type: normalized_delta
  increment_rms_location: OM4_increment_rms_wet.zarr
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps:                            [1, 2, 4, 8, 16, 32]
step_transition:                     [30, 45, 55, 62, 67]
step_batch_size:                  [4, 4, 4, 4,  2,  1]
step_gradient_accumulation_steps: [1, 1, 1, 1,  2,  4]
preemptible: true

backend: auto

experiment:
  name: nd2in1_step_curriculum
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../normalized_delta_2in1out/data.yaml
model: !include ../normalized_delta_2in1out/model.yaml
