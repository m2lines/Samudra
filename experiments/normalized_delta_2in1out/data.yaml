# 1° OM4 v2026-09, two input states, one five-day output per model call.
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds_hfds_anom
    train_time:
      start: "1975-01-03"
      end: "2013-09-30"
    val_time:
      start: "2013-10-05"
      end: "2014-10-05"
    inference_time:
      start: "2014-10-10"
      end: "2022-12-24"
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
# Rust loader, as in PR #969's run. The Python CPU loader takes ~24 s per batch
# here, which starves the GPUs below the scheduler's utilization floor. The
# Rust loader needs hfds_anomalies materialized in the store, so data_root
# must point at a store staged by stage_rust_store.py.
loading:
  type: rust
  max_concurrent_reads: 8
inference_loading:
  num_workers: 4
  persistent_workers: true
input_steps: 2
output_steps: 1
