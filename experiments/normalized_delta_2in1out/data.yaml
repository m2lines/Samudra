# 1° OM4 v2026-09, two input states, one five-day output per model call.
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds_hfds_anom
    train_time:
      start: "1975-01-03"
      end: "2013-09-30"
    val_time:
      start: "2013-10-05"
      end: "2014-10-05"
    inference_time:
      start: "2014-10-10"
      end: "2022-12-24"
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
loading:
  concurrent_compute: true
  type: cpu
  num_workers: 2
input_steps: 2
output_steps: 1
