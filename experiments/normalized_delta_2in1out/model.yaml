# Yuan's normalized_delta backbone: the 1° Samudra U-Net with BatchNorm, fp32.
# pred_residuals + scale_residuals: x[t+1] = x[t] + q * network(x).
checkpointing: all
pred_residuals: true
scale_residuals: true
last_kernel_size: 3
pad: "circular"
use_bfloat16: false

unet:
  ch_width: [280, 380, 480, 520]
  dilation: [1, 2, 4, 8]
  n_layers: [1, 1, 1, 1]

  core_block:
    block_type: "conv_next_block"
    kernel_size: 3
    activation: "capped_gelu"
    upscale_factor: 2
    norm: "batch"

  down_sampling_block: "avg_pool"
  up_sampling_block: "zonally_periodic_upsample"
