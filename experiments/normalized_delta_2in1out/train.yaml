# Yuan's normalized_delta run, ported to samudra, with 2-in-1-out.
# Hyperparameters follow her train.yaml (4 ranks x batch 8, 70 epochs,
# lr 6e-4 cosine, EMA 0.999, seed 15). steps: 8 keeps her 40-day training
# horizon (she used 4 calls x 2 outputs).
debug: false
disk_mode: true
save_freq: 5
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
# Like hers: keep the best checkpoint by one-step validation loss on the
# normalized-delta objective. The rollout is still logged.
validation_score: validation_loss
epochs: 70
batch_size: 8
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler: { type: cosine }
ema_decay: 0.999
faster_decay_at_start: true
test_using_ema: true
loss:
  type: normalized_delta
  # Per-channel RMS five-day change over wet cells, 1975-01-03..2013-09-30,
  # from scripts/compute_tendency_stats.py --over wet. Relative to data_root.
  increment_rms_location: OM4_increment_rms_wet.zarr
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps: [8]
step_transition: []
preemptible: true

backend: auto

experiment:
  name: normalized_delta_2in1out
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include data.yaml
model: !include model.yaml
