disk_mode: true
save_freq: 5
validation_image_log_freq: 10
rollout_validation:
  days:
  - 360
  frequency: 1
  steps_forward: 1
validation_score: rollout_rmse
epochs: 70
batch_size: 4
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler:
  type: cosine
loss:
  type: dynamic
  metric: mse
  limit: 20
finetune: false
resume_ckpt_path: null
data_stride:
- 1
steps:
- 4
step_transition: []
preemptible: false
backend: auto
test_using_ema: true
ema_decay: 0.999
faster_decay_at_start: true
model:
  checkpointing: all
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  unet:
    ch_width:
    - 280
    - 380
    - 480
    - 520
    dilation:
    - 1
    - 2
    - 4
    - 8
    n_layers:
    - 1
    - 1
    - 1
    - 1
    core_block:
      block_type: conv_next_block
      kernel_size: 3
      activation: capped_gelu
      upscale_factor: 2
      norm: batch
    down_sampling_block: avg_pool
    up_sampling_block: zonally_periodic_upsample
  use_bfloat16: false
data:
  sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    grid_type: gaussian
    train_time:
      start: '1975-01-03'
      end: '2013-09-30'
    val_time:
      start: '2013-10-05'
      end: '2014-10-05'
    inference_time:
      start: '2015-01-01'
      end: '2016-01-10'
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
  loading:
    type: rust
    max_concurrent_reads: 8
    prefetch_batches: 2
    prefetch_to_device: true
  inference_loading:
    num_workers: 4
    persistent_workers: true
  input_steps: 2
  output_steps: 2
  loader_version: om4-torch
  normalize_before_mask: true
  masked_fill_value: 0.0
experiment:
  name: baseline
  rand_seed: 15
  base_output_dir: /projects/ny/lz1955/multiscale/jrusak/runs/om4-nonpartial-v2-20261105/output  # pragma: allowlist secret (filesystem path)
  data_root: /projects/ny/lz1955/multiscale/jrusak/data/om4/v2026-09/om4_onedeg  # pragma: allowlist secret (filesystem path)
  wandb:
    mode: online
    project: default
    entity: ocean_emulators
    group: om4-nonpartial-v2-20261105
    tags:
    - nonpartial
    - v2
    - 1deg
    - baseline
