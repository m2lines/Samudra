debug: false
disk_mode: true
save_freq: 5
rollout_validation:
  days: [90]
  frequency: 1
  steps_forward: 1
checkpoint_validation_metric: rollout_rmse
epochs: 70
batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.0006
scheduler:
  type: cosine
loss: mse
test_using_ema: true
ema_decay: 0.999
faster_decay_at_start: true
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps: [4]
step_transition: []
preemptible: true
backend: nccl
experiment:
  name: score-samudra
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: online
    entity: ocean_emulators
    project: default
data:
  input_steps: 2
  output_steps: 2
  sources:
    - type: om4
      prognostic_vars_key: thermo_dynamic_all
      boundary_vars_key: tau_hfds
      train_time: {start: '1975-01-03', end: '2013-10-05'}
      val_time: {start: '2013-10-05', end: '2014-10-05'}
      data_location: OM4.zarr
      data_means_location: OM4_means.zarr
      data_stds_location: OM4_stds.zarr
  loading:
    type: rust
    max_concurrent_reads: 8
    prefetch_batches: 2
    prefetch_to_device: true
model:
  arm: B
  checkpointing: all
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  use_bfloat16: true
  gradient_detach_interval: 0
  unet:
    ch_width: [280, 380, 480, 520]
    dilation: [1, 2, 4, 8]
    n_layers: [1, 1, 1, 1]
    core_block:
      block_type: conv_next_block
      kernel_size: 3
      activation: capped_gelu
      upscale_factor: 2
      norm: instance
    down_sampling_block: avg_pool
    up_sampling_block: zonally_periodic_upsample
    drop_path_rate: 0.0
