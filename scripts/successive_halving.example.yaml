schema_version: 1
name: example-2deg-architecture-search
rungs: [1, 3, 6, 12]
promotion_fraction: 0.5
minimum_promoted: 1
metric: validation_loss
mode: min

runtime:
  output_base: /scratch/USER/runs/example-2deg-architecture-search
  train_harness: /scratch/USER/Samudra/scripts/slurm_apptainer_train.sbatch
  worker_harness: /scratch/USER/Samudra/scripts/successive_halving_worker.sbatch
  data_root: /scratch/USER
  scratch_dir: /scratch/USER
  sif_path: /scratch/USER/.apptainer-images/physicsnemo-26.05-latest.sif
  wandb_mode: online

slurm:
  account: torch_pr_347_lzanna
  partition: rtx6000_lzanna
  controller_partition: cs
  python: /scratch/USER/samudra-venv/bin/python
  cpus_per_task: 4
  memory: 32G
  gres: gpu:rtx6000:1
  time_by_rung: ["02:00:00", "04:00:00", "06:00:00", "12:00:00"]
  max_concurrent: 8

candidates:
  - name: reference
    fixed: true
    config: experiments/search/train_reference.yaml
    code_commit: "0000000000000000000000000000000000000000"
    code_layer: /scratch/USER/.apptainer-code-layers/samudra-code-0000000000000000000000000000000000000000.img
    args: []
  - name: candidate
    config: experiments/search/train_candidate.yaml
    code_commit: "1111111111111111111111111111111111111111"
    code_layer: /scratch/USER/.apptainer-code-layers/samudra-code-1111111111111111111111111111111111111111.img
    args:
      - --batch_size=2
      - --gradient_accumulation_steps=16
