# Autoregressive rollout 2014-10-10 → 2022-12-24 from the final EMA checkpoint,
# then samudra.metrics against OM4 and observations. model_omit.yaml must match
# training: a checkpoint loads under either land setting, so a mismatch would
# not fail.
debug: false
save_zarr: true
disk_mode: true
num_model_steps_forward: 25

experiment:
  name: land_omit_onedeg_eval
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include data.yaml
model: !include model_omit.yaml
observations:
  argo_iap_location: /scratch/am16581/data/obs/argo-iap.zarr
  duacs_location: /scratch/am16581/data/obs/duacs.zarr
  oisst_location: /scratch/am16581/data/obs/oisst.zarr
  baselines: [om4]
  bootstrap_samples: 10000
  rmse_start: "2015-01-01"
  rmse_end: "2022-12-31"
  velocity_kind: absolute
