backend: auto
batch_size: 4
data:
  inference_loading:
    num_workers: 4
    persistent_workers: true
  input_steps: 2
  loader_version: om4-torch
  loading:
    concurrent_compute: true
    num_workers: 4
    persistent_workers: true
    pin_mem: true
    type: cpu
  masked_fill_value: 0.0
  normalize_before_mask: true
  output_steps: 2
  sources:
  - boundary_vars_key: tau_hfds_hfds_anom
    data_location: OM4.zarr
    data_means_location: OM4_means.zarr
    data_stds_location: OM4_stds.zarr
    grid_type: gaussian
    inference_time:
      end: '2022-12-24'
      start: '2014-10-10'
    prognostic_vars_key: thermo_dynamic_all
    train_time:
      end: '2013-09-30'
      start: '1975-01-03'
    type: om4
    val_time:
      end: '2014-10-05'
      start: '2013-10-05'
data_stride:
- 1
debug: false
delayed_loss_estimate: false
disk_mode: true
ema_decay: 0.999
epochs: 70
experiment:
  base_output_dir: /scratch/am16581/runs
  data_root: /scratch/am16581/data/om4_onedeg_v3
  name: 2026-11-09-onedeg-tendency-residual
  rand_seed: 15
  search: null
  wandb:
    entity: ocean_emulators
    group: onedeg-tendency-residual-20261109
    mode: online
    notes: Paper Samudra 2 backbone and optimizer; uncapped fixed training-only 5-day
      tendency weights plus residual prediction. Two inputs/two outputs retained.
      Final epoch EMA evaluation.
    project: default
    tags:
    - experiment
    - onedeg
    - tendency-loss
    - residual-prediction
faster_decay_at_start: true
finetune: false
gradient_accumulation_steps: 1
learning_rate: 0.0006
loss:
  max_weight_ratio: null
  metric: mse
  persistence_rms_location: /scratch/am16581/runs/_experiments/2026-11-09-onedeg-tendency-residual/stats/persistence_rms.zarr
  type: tendency
model:
  add_3d_coordinates: false
  checkpointing: all
  gradient_detach_interval: 0
  last_kernel_size: 3
  pad: circular
  pos_channels: 0
  pred_residuals: true
  unet:
    ch_width:
    - 280
    - 380
    - 480
    - 520
    core_block:
      activation: capped_gelu
      block_type: conv_next_block
      kernel_size: 3
      norm: batch
      pointwise_linear: false
      upscale_factor: 2
    dilation:
    - 1
    - 2
    - 4
    - 8
    down_sampling_block: avg_pool
    drop_path_rate: 0.0
    n_layers:
    - 1
    - 1
    - 1
    - 1
    up_sampling_block: zonally_periodic_upsample
  use_bfloat16: false
post_train_eval: null
preemptible: true
profiler:
  cuda_snapshot_frequency: null
resume_ckpt_path: null
rollout_validation:
  days:
  - 360
  frequency: 1
  model_steps: -1
  steps_forward: 1
save_freq: 5
scheduler:
  target_epochs: null
  type: cosine
step_transition: []
steps:
- 4
test_using_ema: true
validation_image_log_freq: 10
validation_score: rollout_rmse
