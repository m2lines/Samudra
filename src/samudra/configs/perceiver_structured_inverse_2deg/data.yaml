concurrent_compute: true
loading:
  type: cpu
  num_workers: 2
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    train_time: {start: "1975-01-03", end: "2013-10-05"}
    val_time: {start: "2013-10-05", end: "2014-10-05"}
    inference_times:
      - {start: "2014-10-05", end: "2015-10-05"}
    data_location:
      type: local
      path: /mnt/lustre/nyu/amerose/data/om4_twodeg/OM4.zarr
    data_means_location:
      type: local
      path: /mnt/lustre/nyu/amerose/data/om4_twodeg/OM4_means.zarr
    data_stds_location:
      type: local
      path: /mnt/lustre/nyu/amerose/data/om4_twodeg/OM4_stds.zarr
