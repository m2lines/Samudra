concurrent_compute: true
loading:
  type: cpu
  # Four candidates share a 32-CPU allocation, so each candidate receives
  # eight workers. Object-store requests can overlap while a batch is built.
  num_workers: 8
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    # Match the local-filesystem smoke exactly for a controlled comparison.
    train_time: {start: "1975-01-03", end: "1982-01-03"}
    val_time: {start: "1982-01-03", end: "1983-01-03"}
    inference_times:
      - {start: "1983-01-03", end: "1983-02-02"}
    data_location: &osn_data
      type: s3
      endpoint_url: https://nyu1.osn.mghpcc.org
      anon: true
      bucket: m2lines-pubs
      path: Samudra/v2026-07/om4_twodeg/OM4.zarr
    data_means_location:
      <<: *osn_data
      path: Samudra/v2026-07/om4_twodeg/OM4_means.zarr
    data_stds_location:
      <<: *osn_data
      path: Samudra/v2026-07/om4_twodeg/OM4_stds.zarr
