concurrent_compute: true
loading:
  type: cpu
  num_workers: 2
sources:
  - type: om4
    prognostic_vars_key: thermo_dynamic_all
    boundary_vars_key: tau_hfds
    # Seven years yields roughly 32 batch-16 iterations: long enough to
    # measure steady-state utilization without paying for a complete search.
    train_time: {start: "1975-01-03", end: "1982-01-03"}
    val_time: {start: "1982-01-03", end: "1983-01-03"}
    inference_times:
      - {start: "1983-01-03", end: "1983-02-02"}
    data_location:
      type: local
      path: /scratch/am16581/data/Samudra/v2026-07/om4_twodeg/OM4.zarr
    data_means_location:
      type: local
      path: /scratch/am16581/data/Samudra/v2026-07/om4_twodeg/OM4_means.zarr
    data_stds_location:
      type: local
      path: /scratch/am16581/data/Samudra/v2026-07/om4_twodeg/OM4_stds.zarr
