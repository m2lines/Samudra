pred_residuals: true
last_kernel_size: 3
pad: circular
checkpointing: null
embedding_dim: 128
perceiver_implementation: auto
patch_extent: [12.0, 20.0]

encoder:
  architecture: spatial_grid
  spatial_query_shape: [2, 2]
  spatial_query_channels: 32
  queries_dim: 64
  moment_count: 16
  mean_channels: 32
  moment_add_geometry: false
  detail_count: 14
  perceiver:
    depth: 2
    latent_dim: 64
    num_latents: 64
    cross_heads: 1
    latent_heads: 8
    cross_dim_head: 64
    latent_dim_head: 64

decoder:
  architecture: direct_cross_attention
  perceiver:
    depth: 2
    latent_dim: 64
    num_latents: 64
    cross_heads: 2
    latent_heads: 8
    cross_dim_head: 64
    latent_dim_head: 64
  queries_dim: 128
  window_patches: 6
  context_patches: 0
  output_overlap_patches: 1
  processor_conditioning: false
  pixel_refinement: false
  detail_count: 14
  residual_hidden_dim: 128
  residual_heads: 4
  residual_dim_head: 32
  residual_neighborhood_radius: 1
  residual_position_bias_strength: 8.0
  residual_query_chunk_size: 4096

processor:
  ch_width: [380, 480]
  dilation: [1, 1]
  n_layers: [1, 1]
  core_block:
    block_type: conv_next_block
    kernel_size: 3
    activation: capped_gelu
    upscale_factor: 2
    norm: instance
    pointwise_linear: true
  down_sampling_block: avg_pool
  up_sampling_block: zonally_periodic_upsample
