# yaml-language-server: $schema=../schemas/SearchConfig.json

name: perceiver-structured-inverse-2deg
algorithm:
  type: successive_halving
  rungs: [1, 3, 6, 12]
  promotion_fraction: 0.5
  minimum_promoted: 2
objective: {metric: validation_loss, mode: min}
metrics:
  - validation_loss
  - inference_loss
  - train_loss
  - best_validation_loss
  - inference/time_mean_norm/rmse/channel_mean
  - inference/time_mean_norm/rmse/uo
  - inference/time_mean_norm/rmse/vo
  - inference/mean/weighted_grad_mag_percent_diff/thetao
  - inference/mean/weighted_grad_mag_percent_diff/so
  - inference/mean/weighted_grad_mag_percent_diff/uo
  - inference/mean/weighted_grad_mag_percent_diff/vo
  - inference/mean/weighted_grad_mag_percent_diff/zos
  - val/seam/window_jump_ratio/channel_mean
  - val/seam/window_periodic_power_ratio/channel_mean

executor:
  type: slurm
  output_dir: /mnt/lustre/nyu/amerose/searches
  harness: /mnt/lustre/nyu/amerose/code/Samudra-structured-perceiver-alpha/scripts/slurm_apptainer_search_alpha.sbatch
  account: nyu
  partition: nyu
  controller_partition: nyu
  qos: test
  controller_qos: test
  controller_gres: gpu:2
  python: /mnt/lustre/nyu/amerose/code/Samudra-structured-perceiver-alpha/experiments/perceiver_search_2deg/container_python_alpha.sh
  cpus_per_task: 4
  memory: 28G
  gres: gpu:2
  time_by_rung: ["02:00:00", "02:00:00", "02:00:00", "02:00:00"]
  max_concurrent: 4
  rung0_probe: true
  data_root: /mnt/lustre/nyu/amerose/data/om4_twodeg
  scratch_dir: /mnt/lustre/nyu/amerose
  sif_path: /mnt/lustre/nyu/amerose/.apptainer-images/physicsnemo-26.05-native-sdpa.sif
  code_dir: /mnt/lustre/nyu/amerose/code/Samudra-structured-perceiver-alpha
  apptainer_module: apptainer

candidates:
  - name: spatial-grid2-direct
    config: perceiver_structured_inverse_2deg/train.yaml

  - name: moment16-geometry-direct
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.encoder.moment_add_geometry=true

  - name: moment16-direct
    config: perceiver_structured_inverse_2deg/train.yaml
    args: [--model.encoder.architecture=patch_moment]

  - name: moment16-local
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.decoder.architecture=structured_local

  - name: moment4-local
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.encoder.moment_count=4
      - --model.decoder.architecture=structured_local

  - name: spatial-grid2-local
    config: perceiver_structured_inverse_2deg/train.yaml
    args: [--model.decoder.architecture=structured_local]

  - name: spatial-grid4-direct
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.spatial_query_shape=[4,4]
      - --model.patch_extent=[24.0,40.0]

  - name: dct14-paired
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.architecture=dct_detail
      - --model.decoder.architecture=dct_detail
      - --model.decoder.pixel_refinement=true

  - name: moment16-wide-direct
    config: perceiver_structured_inverse_2deg/train.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.decoder.perceiver.cross_heads=4

  - name: pooled-perceiver-direct
    config: perceiver_structured_inverse_2deg/train.yaml
    args: [--model.encoder.architecture=perceiver]
