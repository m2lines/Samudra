# yaml-language-server: $schema=../schemas/SearchConfig.json

name: perceiver-structured-inverse-2deg-torch-adaptive
algorithm:
  type: successive_halving
  rungs: [1, 3, 6, 12]
  promotion_fraction: 0.5
  minimum_promoted: 2
objective: {metric: validation_loss, mode: min}
metrics:
  - validation_loss
  - inference_loss
  - train_loss
  - best_validation_loss
  - inference/time_mean_norm/rmse/channel_mean

resources:
  strategy: adaptive_data_parallel
  max_gpus_per_candidate: 8
  effective_global_batch_size: 32
  allowed_world_sizes: [1, 2, 4, 8]

executor:
  # The controller itself runs inside one Slurm allocation. The local pool
  # assigns disjoint CUDA_VISIBLE_DEVICES subsets to concurrent workers.
  type: local
  output_dir: /scratch/am16581/searches
  max_concurrent: 8

artifacts: !include ../search/osn-artifacts.yaml

candidates:
  - name: spatial-grid2-direct
    config: perceiver_structured_inverse_2deg/train_torch.yaml

  - name: moment16-direct
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.patch_extent=[6.0,10.0]

  - name: moment16-local
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.decoder.architecture=structured_local
      - --model.patch_extent=[6.0,10.0]

  - name: moment4-local
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.encoder.moment_count=4
      - --model.decoder.architecture=structured_local
      - --model.patch_extent=[6.0,10.0]

  - name: spatial-grid2-local
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args: [--model.decoder.architecture=structured_local]

  - name: spatial-grid3x4-direct
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.spatial_query_shape=[3,4]
      - --model.patch_extent=[18.0,40.0]

  - name: moment16-wide-direct
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.decoder.perceiver.cross_heads=4
      - --model.patch_extent=[6.0,10.0]

  - name: pooled-perceiver-direct
    config: perceiver_structured_inverse_2deg/train_torch.yaml
    args:
      - --model.encoder.architecture=perceiver
      - --model.patch_extent=[6.0,10.0]
