# yaml-language-server: $schema=../schemas/SearchConfig.json

name: perceiver-2deg-batch16-utilization-smoke
algorithm:
  type: successive_halving
  rungs: [1]
  promotion_fraction: 0.5
  minimum_promoted: 2
objective: {metric: validation_loss, mode: min}
metrics: [validation_loss, train_loss, best_validation_loss]

resources:
  strategy: adaptive_data_parallel
  max_gpus_per_candidate: 2
  effective_global_batch_size: 32
  allowed_world_sizes: [1, 2]

executor:
  type: local
  output_dir: /scratch/am16581/searches
  max_concurrent: 4

artifacts: !include ../search/osn-artifacts.yaml

candidates:
  - name: spatial-grid2-direct
    config: perceiver_structured_inverse_2deg/train_torch_utilization_smoke.yaml

  - name: moment16-geometry-direct
    config: perceiver_structured_inverse_2deg/train_torch_utilization_smoke.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.encoder.moment_add_geometry=true
      - --model.patch_extent=[6.0,10.0]

  - name: moment16-local
    config: perceiver_structured_inverse_2deg/train_torch_utilization_smoke.yaml
    args:
      - --model.encoder.architecture=patch_moment
      - --model.decoder.architecture=structured_local
      - --model.patch_extent=[6.0,10.0]

  - name: dct14-paired
    config: perceiver_structured_inverse_2deg/train_torch_utilization_smoke.yaml
    args:
      - --model.encoder.architecture=dct_detail
      - --model.decoder.architecture=dct_detail
      - --model.decoder.pixel_refinement=true
      - --model.patch_extent=[6.0,10.0]
