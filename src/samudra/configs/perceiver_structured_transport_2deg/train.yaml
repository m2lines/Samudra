debug: false
disk_mode: true
pin_mem: true
save_freq: 1
validation_image_log_freq: 1
epochs: 12
batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 0.0004
scheduler: null
loss: mse
finetune: false
resume_ckpt_path: null
inference_epochs: []
data_stride: [1]
steps: [4]
step_transition: []
preemptible: false
backend: auto
experiment:
  name: perceiver-structured-transport-candidate
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: online
    entity: ocean_emulators
    project: default
    tags: [torch-hpc, om4-2deg, perceiver-structured-transport, native-sdpa]
    notes: Structured latent-transport architecture search on public 2-degree OM4 data.
data: !include ../perceiver_search_2deg/data.yaml
model: !include model.yaml
