# yaml-language-server: $schema=../schemas/TrainConfig.json

debug: false
disk_mode: true
save_freq: 5
# Hourly LLC data: these horizons fit within the held-out 63-day period.
rollout_validation:
  days: [1, 5, 10]
  frequency: 1
  steps_forward: 1
validation_score: rollout_rmse
epochs: 70
batch_size: 4
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler: { type: cosine }
loss:
  type: dynamic
  metric: mse
  limit: 20
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps: [4]
step_transition: []
preemptible: false

backend: auto

experiment:
  name: samudra_llc
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../data/llc.yaml
model: !include ../samudra_om4/model.yaml
