# yaml-language-server: $schema=../schemas/TrainConfig.json

debug: false
disk_mode: true
save_freq: 5
# Roughly one year on the five-day OM4 time grid.
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
checkpoint_validation_metric: rollout_rmse
epochs: 70
batch_size: 2
learning_rate: 0.0006
scheduler: { type: cosine }
loss:
  type: dynamic
  metric: mse
finetune: false
resume_ckpt_path: null
inference_epochs: []
post_train_eval:
  eval_config_path: samudra_mini_om4/eval.yaml
data_stride: [1]
steps: [4]
step_transition: []
preemptible: false

backend: auto

experiment:
  name: samudra_mini_om4
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../data/om4_rust.yaml
model: !include model.yaml
