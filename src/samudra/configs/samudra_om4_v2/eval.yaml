# yaml-language-server: $schema=../schemas/EvalConfig.json

debug: false
save_zarr: true
disk_mode: true
num_model_steps_forward: 25

experiment:
  name: samudra_om4_v2_eval
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../data/om4.yaml
model: !include model.yaml
observations:
  # Scored against DUACS, OISST and ARGO-IAP once the rollout is on disk.
  # Paths resolve against experiment.data_root; the skypilot eval job stages
  # them under ~/data/obs/.
  enabled: true
  duacs_location: obs/duacs.zarr
  oisst_location: obs/oisst.zarr
  argo_iap_location: obs/argo-iap.zarr
  # Eight complete calendar years, so the score and its block bootstrap share
  # equal-weight blocks.
  rmse_start: "2015-01-01"
  rmse_end: "2022-12-31"
