# yaml-language-server: $schema=../schemas/TrainConfig.json

debug: false
disk_mode: true
save_freq: 5
# Roughly one year on the five-day OM4 time grid.
rollout_validation:
  days: [360]
  frequency: 1
  steps_forward: 1
checkpoint_validation_metric: rollout_rmse
epochs: 70
batch_size: 1
learning_rate: 0.0006
gradient_accumulation_steps: 4
scheduler: { type: cosine }
loss:
  type: dynamic
  metric: mse
  limit: 20
finetune: false
resume_ckpt_path: null
data_stride: [1]
steps: [4]
step_transition: []
preemptible: false

backend: auto

experiment:
  name: samudra_om4_v2_highres
  rand_seed: 15
  base_output_dir: .LOCAL
  wandb:
    mode: disabled
    project: default
data: !include ../data/om4.yaml
model: !include model.yaml
