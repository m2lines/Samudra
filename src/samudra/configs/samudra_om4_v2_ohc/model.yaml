# yaml-language-server: $schema=../schemas/SamudraConfig.json

checkpointing: all
pred_residuals: false
last_kernel_size: 3
pad: "circular"

unet:
  ch_width: [280, 380, 480, 520]
  dilation: [1, 2, 4, 8]
  n_layers: [1, 1, 1, 1]

  core_block:
    block_type: "conv_next_block"
    kernel_size: 3
    activation: "capped_gelu"
    upscale_factor: 2
    norm: "batch"

  down_sampling_block: "avg_pool"
  up_sampling_block: "zonally_periodic_upsample"

corrector:
  non_negative_corrector_names: null
  ocean_heat_corrector: true
  # Soft penalty on the corrector's own raw-budget imbalance, on top of the
  # (unconditional, whenever a corrector is attached) pre-correction
  # supervision in BaseModel.forward. Set to 0 to isolate the effect of
  # pre-correction supervision alone. See https://arxiv.org/abs/2607.18416.
  imbalance_penalty_weight: 0.1
