[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61", "wheel" ]

[project]
name = "samudra-verification"
version = "0.1.0"
description = "Property campaigns, mutation analysis, and triage shared by Samudra's projects"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [ "hypothesis>=6.170.13", "pytest>=8.3.4", "pytest-reportlog>=1" ]

[tool.setuptools]
packages = [ "samudra_verification" ]
